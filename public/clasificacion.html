<!-- Force cache refresh v5 -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificación - Portal Deportivo</title>
    <link rel="icon" type="image/png" href="images/De_la_Paz.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              secondary: "#F97316",
              neutralbg: "#F3F4F6",
              darkbg: "#111827",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-out forwards",
              "slide-up": "slideUp 0.5s ease-out forwards",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");

      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">
    <div id="nav-container"></div>

    <div id="main-content" class="flex-1">
      <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
          <div>
            <h1 class="text-4xl font-extrabold text-primary mb-2">
              <i class="fas fa-trophy mr-3"></i>Tabla de Clasificación
            </h1>
            <p class="text-lg text-gray-600">Sigue la trayectoria de tu equipo jornada a jornada</p>
          </div>
          <div class="flex gap-3">
            <button onclick="window.history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-xl font-semibold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
              <i class="fas fa-arrow-left"></i>Volver
            </button>


          </div>
        </div>

        <!-- Controls Section -->
        <div class="bg-white p-6 rounded-2xl shadow-lg border-2 border-primary mb-6">
          <div class="flex flex-col lg:flex-row gap-4 items-end">
            <!-- League Filter -->
            <div class="flex-1">
              <label class="block text-gray-700 font-medium mb-2">Seleccionar Liga</label>
              <div class="relative">
                <select
                  id="league-filter"
                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none"
                >
                  <option value="">Cargando ligas...</option>
                </select>
              </div>
            </div>
            
            <!-- Botón Ver -->
            <div>
              <button id="ver-clasificacion" class="bg-primary hover:bg-blue-700 text-white py-3 px-8 rounded-lg font-semibold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
                <i class="fas fa-eye"></i>Ver Clasificación
              </button>
            </div>
          </div>
        </div>
        <!-- Tabla de Clasificación -->
        <div class="bg-white rounded-2xl shadow-lg border-2 border-primary overflow-hidden">
          <!-- Loading State -->
          <div id="loader" class="text-center py-12 hidden">
            <i class="fas fa-spinner fa-spin text-4xl text-primary mb-4"></i>
            <p class="text-gray-500">Calculando posiciones...</p>
          </div>

          <!-- No Data State -->
          <div id="no-data" class="text-center py-12">
            <i class="fas fa-list-ol text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">Selecciona una liga</h3>
            <p class="text-gray-500">Elige una liga del menú desplegable y haz clic en "Ver Clasificación" para mostrar la tabla de posiciones.</p>
          </div>

          <!-- Table Card -->
          <div class="overflow-x-auto">
            <table id="table-card" class="min-w-full leading-normal hidden">
              <thead>
                <tr class="bg-primary text-white">
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider">Pos</th>
                  <th class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider">Equipo</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider" title="Partidos Jugados">PJ</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden sm:table-cell" title="Partidos Ganados">PG</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden sm:table-cell" title="Partidos Empatados">PE</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden sm:table-cell" title="Partidos Perdidos">PP</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden md:table-cell" title="Goles a Favor">GF</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden md:table-cell" title="Goles en Contra">GC</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider hidden md:table-cell" title="Diferencia de Goles">DG</th>
                  <th class="px-6 py-4 text-center text-xs font-semibold uppercase tracking-wider">Pts</th>
                </tr>
              </thead>
              <tbody id="standings-body" class="bg-white divide-y divide-gray-200">
                <!-- Rows injected via JS -->
              </tbody>
            </table>
          </div>
          
          <div class="bg-gray-50 p-4 border-t border-gray-200 text-xs text-center text-gray-500">
            Última actualización: <span id="last-updated">Hoy</span>
          </div>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="plantilla.js"></script>
    <script src="js/api-client.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const leagueFilter = document.getElementById("league-filter");
        const tableCard = document.getElementById("table-card");
        const standingsBody = document.getElementById("standings-body");
        const loader = document.getElementById("loader");
        const noData = document.getElementById("no-data");
        const lastUpdated = document.getElementById("last-updated");

        let allLeagues = [];
        let firebaseDb = null;

        // Delay init slightly to allow api-client.js and plantilla.js to do their thing
        setTimeout(init, 500);

        async function init() {
          // Setup Firebase if available
          if (typeof firebase !== "undefined" && firebase.apps.length > 0) {
            firebaseDb = firebase.firestore();
          }

          // Setup event listeners DESPUÉS de que el DOM esté listo
          setupEventListeners();

          await loadLeagues();
        }

        function setupEventListeners() {
          // Setup event listeners


          // Botón "Ver Clasificación"
          document.getElementById('ver-clasificacion').addEventListener('click', () => {
            const ligaSeleccionada = leagueFilter.value;
            
            if (!ligaSeleccionada) {
              alert('❌ Por favor, selecciona una liga primero');
              return;
            }
            
            loadStandings(ligaSeleccionada);
          });


        }

        function showLoader(show) {
          if (show) {
            loader.classList.remove("hidden");
            tableCard.classList.add("hidden");
            noData.classList.add("hidden");
          } else {
            loader.classList.add("hidden");
          }
        }

        async function loadLeagues() {
          showLoader(true);
          try {
            // Usar directamente la API REST en lugar del cliente
            const response = await fetch('/api/ligas');
            
            if (!response.ok) {
              throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
            }
            
            const ligasData = await response.json();
            allLeagues = Array.isArray(ligasData) ? ligasData : [];

            leagueFilter.innerHTML = "";

            if (allLeagues.length === 0) {
              leagueFilter.innerHTML = "<option value=''>No hay ligas disponibles</option>";
              showLoader(false);
              noData.classList.remove("hidden");
              return;
            }

            allLeagues.forEach((league, index) => {
              const option = document.createElement("option");
              option.value = league.id;
              option.textContent = league.NOMBRE || league.nombre || 'Liga sin nombre';
              leagueFilter.appendChild(option);
            });

            showLoader(false);
          } catch (error) {
            console.error("Error loading leagues:", error);
            leagueFilter.innerHTML = "<option value=''>Error cargando ligas</option>";
            showLoader(false);
            noData.classList.remove("hidden");
          }
        }

        async function loadStandings(leagueId) {
          showLoader(true);
          standingsBody.innerHTML = "";
          noData.classList.add("hidden");
          tableCard.classList.add("hidden");

          try {
            // Obtener información de la liga
            const ligaInfo = allLeagues.find(l => l.id === leagueId);
            if (!ligaInfo) {
              throw new Error('No se encontró información de la liga');
            }
            
            let matches = [];
            
            // 1. Intentar primero por ID de liga (formato nuevo)
            try {
              const responseById = await fetch(`/api/partidos/liga/${leagueId}`);
              
              if (responseById.ok) {
                matches = await responseById.json();
              }
            } catch (e) {
              // Continuar con el siguiente método
            }
            
            // 2. Si no encontró partidos por ID, intentar por nombre (formato legacy)
            if (!matches || matches.length === 0) {
              if (!ligaInfo.NOMBRE) {
                throw new Error('Liga sin nombre - no se puede buscar por nombre');
              }
              
              try {
                const responseByName = await fetch(`/api/partidos/nombre/${encodeURIComponent(ligaInfo.NOMBRE)}`);
                
                if (responseByName.ok) {
                  matches = await responseByName.json();
                }
              } catch (e) {
                // Error final
              }
            }
            
            // 3. Verificar si se encontraron partidos
            if (!matches || matches.length === 0) {
              throw new Error(`No se encontraron partidos para la liga "${ligaInfo.NOMBRE}" ni por ID ni por nombre`);
            }

            // Calcular clasificación
            const standings = calculateStandings(matches);

            if (standings.length === 0) {
              noData.classList.remove("hidden");
              showLoader(false);
              return;
            }

            // Mostrar clasificación
            renderStandings(standings);
            showLoader(false);

          } catch (error) {
            console.error("❌ Error completo:", error);
            noData.classList.remove("hidden");
            showLoader(false);
          }
        }

        function hasScore(match) {
          return (
            match.goles1 !== undefined ||
            match.homeScore !== undefined ||
            match.GOLESLOCAL !== undefined
          );
        }

        function getScoreLocal(match) {
          return parseInt(
            match.goles1 ??
              match.homeScore ??
              match.GOLESLOCAL ??
              match.goles_local ??
              0
          );
        }

        function getScoreVisitante(match) {
          return parseInt(
            match.goles2 ??
              match.awayScore ??
              match.GOLESVISITANTE ??
              match.goles_visitante ??
              0
          );
        }

        function calculateStandings(matches) {
          // FILTRAR: Solo partidos finalizados
          const partidosFinalizados = matches.filter(match => {
            const estado = (match.estado || match.ESTADO || '').toLowerCase();
            return estado === 'finalizado';
          });
          
          if (partidosFinalizados.length === 0) {
            return [];
          }
          
          const stats = {};

          partidosFinalizados.forEach((match, index) => {
            // Normalize data keys - usar los mismos campos que el debug
            const home = match.LOCAL || match.local || match.equipo1;
            const away = match.VISITANTE || match.visitante || match.equipo2;

            // Obtener goles (usar 0 si no hay goles definidos)
            const gH = parseInt(match.GOLESLOCAL || match.goles1 || 0);
            const gA = parseInt(match.GOLESVISITANTE || match.goles2 || 0);

            // Procesar solo partidos finalizados que tengan equipos definidos
            if (home && away) {
              // Init stats if not exist
              if (!stats[home])
                stats[home] = {
                  name: home,
                  pj: 0,
                  pg: 0,
                  pe: 0,
                  pp: 0,
                  gf: 0,
                  gc: 0,
                  pts: 0,
                };
              if (!stats[away])
                stats[away] = {
                  name: away,
                  pj: 0,
                  pg: 0,
                  pe: 0,
                  pp: 0,
                  gf: 0,
                  gc: 0,
                  pts: 0,
                };

              // Incrementar partidos jugados (solo finalizados)
              stats[home].pj++;
              stats[home].gf += gH;
              stats[home].gc += gA;

              stats[away].pj++;
              stats[away].gf += gA;
              stats[away].gc += gH;

              // Calcular resultados
              if (gH > gA) {
                stats[home].pg++;
                stats[home].pts += 3;
                stats[away].pp++;
              } else if (gH < gA) {
                stats[away].pg++;
                stats[away].pts += 3;
                stats[home].pp++;
              } else {
                stats[home].pe++;
                stats[home].pts += 1;
                stats[away].pe++;
                stats[away].pts += 1;
              }
            }
          });

          const equipos = Object.values(stats);

          // Convert to array and Sort
          return equipos.sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts; // Points
            return b.gf - b.gc - (a.gf - a.gc); // Goal Diff
          });
        }

        function renderStandings(teams) {
          if (teams.length === 0) {
            noData.classList.remove("hidden");
            tableCard.classList.add("hidden");
            return;
          }

          standingsBody.innerHTML = ""; // Limpiar tabla

          teams.forEach((team, index) => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-gray-50 transition";

            // Rank Styles - sin indicadores de ascenso/descenso
            let posClass = "font-semibold text-gray-700";
            let rankIndicator = "";
            if (index === 0) {
              posClass = "font-bold text-yellow-600";
              rankIndicator = '<i class="fas fa-crown text-yellow-500 text-xs ml-1"></i>';
            }

            const diff = team.gf - team.gc;
            const diffClass = diff > 0 ? "text-green-600" : diff < 0 ? "text-red-500" : "text-gray-400";

            tr.innerHTML = `
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center">
                    <span class="${posClass}">${index + 1}</span> ${rankIndicator}
                </td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white">
                    <div class="flex items-center">
                        <div class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center font-bold text-sm mr-3">
                            ${team.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="font-medium text-gray-900">${team.name}</div>
                            <div class="text-sm text-gray-500">${team.pts} puntos</div>
                        </div>
                    </div>
                </td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center font-medium">${team.pj}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center text-gray-600 hidden sm:table-cell">${team.pg}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center text-gray-600 hidden sm:table-cell">${team.pe}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center text-gray-600 hidden sm:table-cell">${team.pp}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center text-gray-500 hidden md:table-cell">${team.gf}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center text-gray-500 hidden md:table-cell">${team.gc}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center font-medium hidden md:table-cell ${diffClass}">${diff > 0 ? "+" + diff : diff}</td>
                <td class="px-6 py-4 border-b border-gray-200 bg-white text-center">
                    <span class="inline-block px-3 py-1 text-sm font-bold rounded-full bg-primary text-white">
                        ${team.pts}
                    </span>
                </td>
              `;
            standingsBody.appendChild(tr);
          });
          
          // Mostrar la tabla
          tableCard.classList.remove("hidden");
          noData.classList.add("hidden");
        }

        function hasScore(match) {
          return (
            match.goles1 !== undefined ||
            match.homeScore !== undefined ||
            match.GOLESLOCAL !== undefined
          );
        }

        function getScoreLocal(match) {
          return parseInt(
            match.goles1 ??
              match.homeScore ??
              match.GOLESLOCAL ??
              match.goles_local ??
              0
          );
        }

        function getScoreVisitante(match) {
          return parseInt(
            match.goles2 ??
              match.awayScore ??
              match.GOLESVISITANTE ??
              match.goles_visitante ??
              0
          );
        }
      });
    </script>
  </body>
</html>
