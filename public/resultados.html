<!-- Force cache refresh v3 -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultados - Portal Deportivo - Asociación de la Paz</title>
    <link rel="icon" type="image/png" href="images/De_la_Paz.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB", // Azul principal
              secondary: "#F97316", // Naranja acento
              neutralbg: "#F3F4F6", // Gris claro para fondos
            },
          },
        },
      };
    </script>
  </head>

  <body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">
    <div id="nav-container"></div>

    <div id="main-content" class="flex-1">
      <main class="max-w-6xl mx-auto px-6 py-12">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
          <div>
            <h1 class="text-4xl font-extrabold text-primary mb-2">
              <i class="fas fa-trophy mr-3"></i>Resultados de Partidos
            </h1>
            <p class="text-lg text-gray-600">Consulta los resultados actualizados de los últimos partidos disputados.</p>
          </div>
          <div class="flex gap-3">
            <button onclick="window.history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-xl font-semibold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
              <i class="fas fa-arrow-left"></i>Volver
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-12">
          <i class="fas fa-spinner fa-spin text-4xl text-primary mb-4"></i>
          <p class="text-gray-500">Cargando resultados...</p>
        </div>

        <!-- VISUALIZADOR DE LIGA -->
        <div
          class="bg-white p-8 rounded-xl shadow-lg mb-12 border-2 border-indigo-100"
        >
          <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">
              <i class="fas fa-eye text-secondary mr-2"></i>Visualizador de Liga
            </h2>
            <p class="text-gray-600">
              Selecciona una liga para visualizar los partidos.
            </p>
          </div>

          <div
            class="flex flex-col md:flex-row gap-4 justify-center items-end mb-8"
          >
            <div class="w-full md:w-1/3">
              <label
                for="ligaSelect"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Liga</label
              >
              <select
                id="ligaSelect"
                class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50"
              >
                <option value="">Cargando ligas...</option>
              </select>
            </div>

            <button
              id="btnSortear"
              class="bg-primary text-white py-3 px-8 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md w-full md:w-auto"
            >
              <i class="fas fa-eye mr-2"></i>Ver Liga
            </button>


          </div>

          <!-- Contenedor de Partidos de la Liga -->
          <div id="sorteo-container" class="hidden">
            <h3
              class="text-lg font-bold text-gray-800 mb-4 text-center border-b pb-2"
            >
              Partidos de la Liga
            </h3>
            <div
              id="matches-grid"
              class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"
            >
              <!-- Aquí se insertarán los partidos -->
            </div>
          </div>

          <div
            id="feedback-sorteo"
            class="hidden text-center mt-4 p-3 rounded-lg bg-red-100 text-red-700"
          ></div>
        </div>

        <!-- Results Container -->
        <div
          id="results-container"
          class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 hidden"
        >
          <!-- Los resultados se cargarán aquí dinámicamente -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-12 hidden">
          <i class="fas fa-calendar-times text-6xl text-gray-300 mb-4"></i>
          <h3 class="text-xl font-semibold text-gray-600 mb-2">
            No hay resultados disponibles
          </h3>
          <p class="text-gray-500">
            Aún no se han registrado partidos o resultados.
          </p>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <!-- Firebase SDKs para leer directamente desde Firebase -->
    <!-- <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> -->
    <script src="js/api-client.js"></script>
    <script src="plantilla.js"></script>
    <script>
      // Función para parsear fechas en formato español
      function parsearFechaEspanol(fechaString) {
        if (!fechaString) return new Date();
        
        try {
          if (fechaString.seconds) {
            return new Date(fechaString.seconds * 1000);
          }
          if (fechaString.toDate && typeof fechaString.toDate === 'function') {
            return fechaString.toDate();
          }
          
          if (typeof fechaString === 'string') {
            const mesesES = {
              'enero': '01', 'febrero': '02', 'marzo': '03', 'abril': '04',
              'mayo': '05', 'junio': '06', 'julio': '07', 'agosto': '08',
              'septiembre': '09', 'octubre': '10', 'noviembre': '11', 'diciembre': '12'
            };
            
            const regex = /(\d{1,2})\s+de\s+(\w+)\s+de\s+(\d{4})\s+a\s+las\s+(\d{1,2}):(\d{2})\s*(AM|PM|a\.m\.|p\.m\.)?/i;
            const match = fechaString.match(regex);
            
            if (match) {
              const [, dia, mes, año, hora, minuto, ampm] = match;
              const mesNumero = mesesES[mes.toLowerCase()];
              
              if (mesNumero) {
                let hora24 = parseInt(hora);
                
                if (ampm) {
                  const ampmLower = ampm.toLowerCase();
                  if ((ampmLower.includes('pm') || ampmLower.includes('p.m')) && hora24 !== 12) {
                    hora24 += 12;
                  } else if ((ampmLower.includes('am') || ampmLower.includes('a.m')) && hora24 === 12) {
                    hora24 = 0;
                  }
                }
                
                const fechaISO = `${año}-${mesNumero}-${dia.padStart(2, '0')}T${hora24.toString().padStart(2, '0')}:${minuto}:00`;
                const fechaFinal = new Date(fechaISO);
                
                if (!isNaN(fechaFinal.getTime())) {
                  return fechaFinal;
                }
              }
            }
            
            const fechaDirecta = new Date(fechaString);
            if (!isNaN(fechaDirecta.getTime())) {
              return fechaDirecta;
            }
          }
          
          return new Date();
        } catch (error) {
          console.error('Error parseando fecha:', error, fechaString);
          return new Date();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const resultsContainer = document.getElementById("results-container");
        const loadingState = document.getElementById("loading-state");
        const emptyState = document.getElementById("empty-state");

        // --- LÓGICA DEL GENERADOR DE JORNADA ---
        const ligaSelect = document.getElementById("ligaSelect");
        const btnSortear = document.getElementById("btnSortear");
        const sorteoContainer = document.getElementById("sorteo-container");
        const matchesGrid = document.getElementById("matches-grid");
        const feedbackSorteo = document.getElementById("feedback-sorteo");

        // Almacenamiento local de ligas
        let ligasCache = [];

        // 1. Cargar Ligas
        fetch("/api/ligas")
          .then((res) => res.json())
          .then((ligas) => {
            ligasCache = ligas;
            ligaSelect.innerHTML =
              '<option value="">-- Selecciona una Liga --</option>';
            ligas.forEach((liga) => {
              const option = new Option(liga.NOMBRE, liga.id);
              ligaSelect.add(option);
            });
          })
          .catch((err) => {
            console.error("Error cargando ligas:", err);
            ligaSelect.innerHTML =
              '<option value="">Error al cargar ligas</option>';
          });

        // 2. Función para Ver Liga
        btnSortear.addEventListener("click", () => {
          const ligaId = ligaSelect.value;
          if (!ligaId) {
            mostrarFeedback("Por favor, selecciona una liga primero.", "error");
            return;
          }

          const liga = ligasCache.find((l) => l.id === ligaId);
          if (!liga) return;

          mostrarFeedback("", "clean");
          cargarPartidosLiga(ligaId, liga.NOMBRE);
        });



        // Función para cargar partidos de una liga específica
        async function cargarPartidosLiga(ligaId, nombreLiga) {
          try {
            mostrarFeedback("Cargando partidos de la liga...", "info");
            
            // Usar el endpoint de partidos por nombre de liga
            const response = await fetch(`/api/partidos/nombre/${encodeURIComponent(nombreLiga)}`);
            
            if (!response.ok) {
              throw new Error(`Error ${response.status}: ${response.statusText}`);
            }
            
            const partidos = await response.json();
            
            mostrarFeedback("", "clean");
            
            if (partidos.length === 0) {
              mostrarPartidosEnGrid([]);
              mostrarFeedback("No se encontraron partidos para esta liga.", "info");
              return;
            }
            
            mostrarPartidosEnGrid(partidos);
            sorteoContainer.classList.remove("hidden");
            
            // Cambiar el título del contenedor
            const titulo = sorteoContainer.querySelector("h3");
            titulo.textContent = `Partidos de ${nombreLiga} (${partidos.length} partidos)`;
            
          } catch (error) {
            console.error("Error cargando partidos de la liga:", error);
            mostrarFeedback(`Error cargando partidos: ${error.message}`, "error");
          }
        }

        // Función para mostrar partidos en el grid
        function mostrarPartidosEnGrid(partidos) {
          matchesGrid.innerHTML = "";
          
          if (partidos.length === 0) {
            const emptyCard = document.createElement("div");
            emptyCard.className = "col-span-full text-center py-8 text-gray-500";
            emptyCard.innerHTML = `
              <i class="fas fa-calendar-times text-4xl mb-4"></i>
              <p>No hay partidos registrados para esta liga.</p>
            `;
            matchesGrid.appendChild(emptyCard);
            return;
          }

          partidos.forEach((partido) => {
            const card = document.createElement("div");
            card.className = "bg-white p-4 rounded-lg border border-gray-200 shadow-sm";
            
            // Formatear fecha
            let fechaFormateada = "Fecha no disponible";
            if (partido.FECHA || partido.fecha) {
              const d = parsearFechaEspanol(partido.FECHA || partido.fecha);
              if (!isNaN(d.getTime())) {
                fechaFormateada = d.toLocaleDateString("es-ES", {
                  day: "2-digit",
                  month: "2-digit",
                  year: "numeric",
                  hour: "2-digit",
                  minute: "2-digit"
                });
              }
            }
            
            // Determinar si el partido tiene resultado
            const tieneResultado = (partido.GOLESLOCAL !== undefined && partido.GOLESLOCAL !== null) || 
                                 (partido.GOLESVISITANTE !== undefined && partido.GOLESVISITANTE !== null);
            
            const golesLocal = partido.GOLESLOCAL || 0;
            const golesVisitante = partido.GOLESVISITANTE || 0;
            
            card.innerHTML = `
              <div class="text-center">
                <div class="text-xs text-gray-500 mb-2">
                  <i class="fas fa-calendar mr-1"></i>${fechaFormateada}
                </div>
                
                <div class="flex items-center justify-between mb-3">
                  <div class="flex-1 text-center">
                    <div class="font-bold text-gray-800 text-sm">${partido.LOCAL || "Equipo Local"}</div>
                  </div>
                  
                  <div class="px-3">
                    ${tieneResultado ? 
                      `<div class="text-lg font-bold text-primary">${golesLocal} - ${golesVisitante}</div>` :
                      `<div class="text-sm text-gray-400">VS</div>`
                    }
                  </div>
                  
                  <div class="flex-1 text-center">
                    <div class="font-bold text-gray-800 text-sm">${partido.VISITANTE || "Equipo Visitante"}</div>
                  </div>
                </div>
                
                <div class="text-xs text-gray-500 space-y-1">
                  ${partido.JORNADA ? `<div><i class="fas fa-list-ol mr-1"></i>Jornada ${partido.JORNADA}</div>` : ""}
                  ${partido.CAMPO ? `<div><i class="fas fa-map-marker-alt mr-1"></i>${partido.CAMPO}</div>` : ""}
                  ${partido.ARBITRO ? `<div><i class="fas fa-user-tie mr-1"></i>Árbitro: ${partido.ARBITRO}</div>` : ""}
                  <div class="mt-2">
                    <span class="inline-block px-2 py-1 rounded-full text-xs font-semibold ${
                      partido.estado === 'finalizado' ? 'bg-green-100 text-green-800' :
                      partido.estado === 'suspendido' ? 'bg-red-100 text-red-800' :
                      'bg-blue-100 text-blue-800'
                    }">
                      ${partido.estado || 'programado'}
                    </span>
                  </div>
                </div>
              </div>
            `;
            
            matchesGrid.appendChild(card);
          });
        }

        function mostrarFeedback(msg, type) {
          if (type === "clean") {
            feedbackSorteo.classList.add("hidden");
            return;
          }
          feedbackSorteo.textContent = msg;
          feedbackSorteo.classList.remove(
            "hidden",
            "bg-green-100",
            "text-green-700",
            "bg-red-100",
            "text-red-700",
            "bg-blue-100",
            "text-blue-700"
          );
          
          if (type === "error") {
            feedbackSorteo.classList.add("bg-red-100", "text-red-700");
          } else if (type === "info") {
            feedbackSorteo.classList.add("bg-blue-100", "text-blue-700");
          } else {
            feedbackSorteo.classList.add("bg-green-100", "text-green-700");
          }
        }

        // Función para cargar todos los resultados (comportamiento original)
        function cargarTodosLosResultados() {
          loadingState.classList.remove("hidden");
          resultsContainer.classList.add("hidden");
          emptyState.classList.add("hidden");
          
          Resultados.get({ limit: 50 })
            .then((data) => {
              loadingState.classList.add("hidden");

              if (!data || data.length === 0) {
                emptyState.classList.remove("hidden");
                return;
              }

              resultsContainer.classList.remove("hidden");
              resultsContainer.innerHTML = ""; // Limpiar contenido anterior

              data.forEach((partido) => {
                const resultCard = document.createElement("div");
                resultCard.className =
                  "bg-white p-6 rounded-2xl shadow-lg border-2 border-primary hover:border-secondary hover:shadow-[0_0_60px_rgba(249,115,22,0.4)] transform hover:-translate-y-2 transition duration-300";

                // Formatear fecha
                let fechaFormateada = "Fecha no disponible";
                if (partido.FECHA) {
                  const d = parsearFechaEspanol(partido.FECHA);
                  if (!isNaN(d.getTime())) {
                    fechaFormateada = d.toLocaleDateString("es-ES", {
                      day: "2-digit",
                      month: "2-digit",
                      year: "numeric",
                    });
                  }
                }

                // Normalizar campos (API)
                const equipo1 = partido.local || partido.equipo1 || "Equipo 1";
                const equipo2 =
                  partido.visitante || partido.equipo2 || "Equipo 2";
                const goles1 =
                  partido.golesLocal !== undefined
                    ? partido.golesLocal
                    : partido.goles1;
                const goles2 =
                  partido.golesVisitante !== undefined
                    ? partido.golesVisitante
                    : partido.goles2;

                resultCard.innerHTML = `
          <div class="text-center">
            <div class="flex items-center justify-center mb-4">
              <i class="fas fa-calendar-alt text-primary mr-2"></i>
              <span class="text-sm text-gray-500">${fechaFormateada}</span>
            </div>

            <div class="flex justify-between items-center mb-4">
              <div class="text-center flex-1">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-2">
                  <i class="fas fa-users text-primary"></i>
                </div>
                <p class="font-semibold text-gray-800 text-sm">${equipo1}</p>
              </div>

              <div class="text-center px-4">
                <div class="text-3xl font-bold text-primary mb-1">
                  ${goles1 ?? "-"} : ${goles2 ?? "-"}
                </div>
                <span class="text-xs text-gray-400 uppercase tracking-wide">
                  Resultado
                </span>
              </div>

              <div class="text-center flex-1">
                <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-2">
                  <i class="fas fa-users text-secondary"></i>
                </div>
                <p class="font-semibold text-gray-800 text-sm">${equipo2}</p>
              </div>
            </div>

            <div class="text-center text-xs text-gray-600 mb-3">
              <div><i class="fas fa-map-marker-alt mr-1"></i>${partido.CAMPO || "Campo por definir"}</div>
              <div><i class="fas fa-user-tie mr-1"></i>Árbitro: ${partido.ARBITRO || "Sin asignar"}</div>
            </div>

            ${
              partido.categoria
                ? `
              <div class="border-t pt-3">
                <span class="inline-block bg-gray-100 text-gray-600 text-xs px-3 py-1 rounded-full">
                  <i class="fas fa-tag mr-1"></i>${partido.categoria}
                </span>
              </div>
            `
                : ""
            }
          </div>
        `;

                resultsContainer.appendChild(resultCard);
              });
            })
            .catch((error) => {
              console.error("Error al cargar resultados:", error);
              loadingState.classList.add("hidden");
              emptyState.classList.remove("hidden");
              resultsContainer.classList.add("hidden");
            });
        }

        // Cargar todos los resultados al inicio
        cargarTodosLosResultados();
      });
    </script>
  </body>
</html>
