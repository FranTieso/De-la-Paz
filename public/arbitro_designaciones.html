<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Designaciones - Asociación de la Paz</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="images/De_la_Paz.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              secondary: "#F97316",
              neutralbg: "#F3F4F6",
            },
          },
        },
      };
    </script>
  </head>

  <body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">
    <div id="nav-container"></div>

    <div id="main-content" class="flex-1">
      <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Header -->
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center">
          <div>
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
              <i class="fas fa-whistle mr-3 text-gray-800"></i>Mis Designaciones
            </h1>
            <p class="text-lg text-gray-600">
              Partidos asignados como árbitro principal.
            </p>
          </div>
          <div class="flex gap-3 mt-4 md:mt-0">
            <button onclick="window.history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-xl font-semibold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
              <i class="fas fa-arrow-left"></i>Volver
            </button>
          </div>
        </div>

        <!-- Información del Árbitro -->
        <div class="mb-8 bg-white p-6 rounded-2xl shadow-lg border-l-4 border-gray-800">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-gray-800 text-white rounded-full flex items-center justify-center">
                <i class="fas fa-whistle text-xl"></i>
              </div>
              <div>
                <h3 class="text-xl font-bold text-gray-800" id="arbitro-name">Cargando...</h3>
                <p class="text-gray-600">Árbitro Principal</p>
              </div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-bold text-gray-800" id="total-partidos">0</div>
              <div class="text-sm text-gray-600">Partidos asignados</div>
            </div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="bg-white p-6 rounded-2xl shadow-lg mb-8">
          <div class="flex flex-wrap gap-4 items-center">
            <div class="flex items-center gap-2">
              <i class="fas fa-filter text-gray-600"></i>
              <span class="font-semibold text-gray-700">Filtros:</span>
            </div>
            
            <div class="flex flex-wrap gap-3">
              <select id="filtro-liga" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="">Todas las ligas</option>
              </select>
              
              <select id="filtro-estado" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="">Todos los estados</option>
                <option value="programado">Programado</option>
                <option value="finalizado">Finalizado</option>
                <option value="suspendido">Suspendido</option>
              </select>
              
              <select id="ordenar-por" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                <option value="fecha">Ordenar por fecha</option>
                <option value="liga">Ordenar por liga</option>
                <option value="campo">Ordenar por campo</option>
                <option value="equipos">Ordenar por equipos</option>
              </select>
              
              <button id="buscar" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition">
                <i class="fas fa-sync-alt mr-2"></i>Actualizar
              </button>
              
              <button id="limpiar-filtros" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
                <i class="fas fa-times mr-2"></i>Limpiar
              </button>
            </div>
          </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-12">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
          <p class="mt-4 text-gray-600">Cargando designaciones...</p>
        </div>

        <!-- Lista de Partidos -->
        <div id="partidos-container" class="hidden">
          <div id="partidos-lista" class="space-y-4">
            <!-- Los partidos se cargarán aquí dinámicamente -->
          </div>
          
          <!-- Sin resultados -->
          <div id="sin-resultados" class="hidden text-center py-12">
            <div class="bg-white p-8 rounded-2xl shadow-lg">
              <i class="fas fa-calendar-times text-6xl text-gray-400 mb-4"></i>
              <h3 class="text-2xl font-bold text-gray-600 mb-2">No hay partidos</h3>
              <p class="text-gray-500">No se encontraron partidos con los filtros aplicados.</p>
            </div>
          </div>
        </div>

        <!-- Error -->
        <div id="error-container" class="hidden text-center py-12">
          <div class="bg-red-50 border border-red-200 p-8 rounded-2xl">
            <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
            <h3 class="text-2xl font-bold text-red-700 mb-2">Error al cargar</h3>
            <p class="text-red-600 mb-4" id="error-message">No se pudieron cargar las designaciones.</p>
            <button id="reintentar" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">
              <i class="fas fa-redo mr-2"></i>Reintentar
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <script src="plantilla.js"></script>
    <script src="js/api-client.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Ocultar contenido inmediatamente
        document.getElementById("main-content").style.display = "none";

        let partidosOriginales = [];
        let partidosFiltrados = [];
        let currentUser = null;
        let todasLasLigas = [];

        // Verificar acceso de árbitro
        function checkArbitroAccess() {
          const user = window.getCurrentUser();

          if (!user || !window.hasRole(user, "arbitro")) {
            show404Page();
            return false;
          }

          currentUser = user;
          document.getElementById("main-content").style.display = "block";
          
          // Mostrar nombre del árbitro
          const arbitroNameElement = document.getElementById("arbitro-name");
          if (arbitroNameElement) {
            let nombreCompleto = user.nombre || "Usuario";
            if (user.apellido1 && user.apellido1 !== "undefined") {
              nombreCompleto += ` ${user.apellido1}`;
            }
            arbitroNameElement.textContent = nombreCompleto;
          }

          return true;
        }

        // Función para mostrar página 404
        function show404Page() {
          fetch("404.html")
            .then((response) => response.text())
            .then((html) => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(html, "text/html");
              const mainContent = doc.querySelector("#main-content");

              if (mainContent) {
                document.getElementById("main-content").innerHTML = mainContent.innerHTML;
                document.getElementById("main-content").style.display = "block";
              } else {
                document.getElementById("main-content").innerHTML = `
                  <div class="flex-1 flex items-center justify-center">
                    <div class="max-w-4xl mx-auto px-6 py-12 text-center">
                      <div class="bg-white p-8 sm:p-12 rounded-2xl shadow-lg border-2 border-primary">
                        <h1 class="text-6xl sm:text-8xl font-bold text-secondary">403</h1>
                        <h2 class="text-2xl sm:text-3xl font-bold text-primary mt-4">Acceso Denegado</h2>
                        <p class="text-lg text-gray-700 mt-2">No tienes permisos para acceder a esta página.</p>
                        <a href="index.html" class="mt-8 inline-block bg-primary text-white py-3 px-6 rounded-lg hover:bg-blue-800 transition font-semibold text-lg">Volver al Inicio</a>
                      </div>
                    </div>
                  </div>
                `;
                document.getElementById("main-content").style.display = "block";
              }
            })
            .catch(() => {
              document.getElementById("main-content").innerHTML = `
                <div class="flex-1 flex items-center justify-center">
                  <div class="max-w-4xl mx-auto px-6 py-12 text-center">
                    <div class="bg-white p-8 sm:p-12 rounded-2xl shadow-lg border-2 border-primary">
                      <h1 class="text-6xl sm:text-8xl font-bold text-secondary">403</h1>
                      <h2 class="text-2xl sm:text-3xl font-bold text-primary mt-4">Acceso Denegado</h2>
                      <p class="text-lg text-gray-700 mt-2">No tienes permisos para acceder a esta página.</p>
                      <a href="index.html" class="mt-8 inline-block bg-primary text-white py-3 px-6 rounded-lg hover:bg-blue-800 transition font-semibold text-lg">Volver al Inicio</a>
                    </div>
                  </div>
                </div>
              `;
              document.getElementById("main-content").style.display = "block";
            });
        }

        // Cargar todas las ligas disponibles
        async function cargarLigas() {
          try {
            const response = await fetch('/api/ligas');
            if (!response.ok) {
              throw new Error(`Error ${response.status}: ${response.statusText}`);
            }
            
            const ligas = await response.json();
            todasLasLigas = ligas || [];
            
            const filtroLiga = document.getElementById("filtro-liga");
            filtroLiga.innerHTML = '<option value="">Selecciona una liga</option>';
            
            todasLasLigas.forEach(liga => {
              const option = document.createElement("option");
              option.value = liga.NOMBRE;
              option.textContent = liga.NOMBRE;
              filtroLiga.appendChild(option);
            });
            
          } catch (error) {
            console.error("Error cargando ligas:", error);
          }
        }

        // Buscar partidos del árbitro
        async function buscarPartidos() {
          if (!currentUser || !currentUser.id) {
            mostrarError("No se pudo obtener la información del usuario");
            return;
          }

          try {
            mostrarLoading(true);
            
            console.log(`🔍 Buscando partidos para árbitro ID: ${currentUser.id}`);
            
            // Usar el endpoint específico para árbitros
            const response = await fetch(`/api/partidos/arbitro/${currentUser.id}`);
            
            if (!response.ok) {
              if (response.status === 404) {
                // No hay partidos asignados
                partidosOriginales = [];
                partidosFiltrados = [];
                actualizarContadorPartidos();
                mostrarPartidos();
                return;
              }
              throw new Error(`Error ${response.status}: ${response.statusText}`);
            }
            
            const partidosDelArbitro = await response.json();
            
            partidosOriginales = partidosDelArbitro || [];
            partidosFiltrados = [...partidosOriginales];
            
            // Información de debug
            console.log(`📊 Partidos asignados encontrados: ${partidosDelArbitro.length}`);
            console.log(`📊 Tu ID de árbitro: ${currentUser.id}`);
            
            if (partidosDelArbitro.length > 0) {
              console.log(`📊 Ejemplo de partido:`, partidosDelArbitro[0]);
              
              // Obtener ligas únicas de los partidos asignados
              const ligasUnicas = [...new Set(partidosDelArbitro
                .map(p => p.LIGA)
                .filter(liga => liga)
              )];
              
              console.log(`📊 Ligas donde tienes partidos asignados:`, ligasUnicas);
              
              // Actualizar el filtro de ligas con solo las ligas donde tiene partidos
              actualizarFiltroLigas(ligasUnicas);
            }
            
            actualizarContadorPartidos();
            aplicarFiltrosAdicionales();
            mostrarPartidos();
            
          } catch (error) {
            console.error("Error buscando partidos:", error);
            mostrarError(error.message);
          } finally {
            mostrarLoading(false);
          }
        }

        // Actualizar filtro de ligas con solo las ligas donde el árbitro tiene partidos
        function actualizarFiltroLigas(ligasConPartidos) {
          const filtroLiga = document.getElementById("filtro-liga");
          filtroLiga.innerHTML = '<option value="">Todas las ligas</option>';
          
          ligasConPartidos.forEach(ligaNombre => {
            const option = document.createElement("option");
            option.value = ligaNombre;
            option.textContent = ligaNombre;
            filtroLiga.appendChild(option);
          });
        }

        // Cargar partidos del árbitro automáticamente
        async function cargarPartidos() {
          // Cargar automáticamente los partidos del árbitro
          await buscarPartidos();
        }

        // Mostrar/ocultar loading
        function mostrarLoading(show) {
          document.getElementById("loading").classList.toggle("hidden", !show);
          document.getElementById("partidos-container").classList.toggle("hidden", show);
          document.getElementById("error-container").classList.add("hidden");
        }

        // Mostrar error
        function mostrarError(mensaje) {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("partidos-container").classList.add("hidden");
          document.getElementById("error-container").classList.remove("hidden");
          document.getElementById("error-message").textContent = mensaje;
        }

        // Actualizar contador de partidos
        function actualizarContadorPartidos() {
          const total = partidosFiltrados.length;
          document.getElementById("total-partidos").textContent = total;
        }

        // Aplicar filtros adicionales (liga, estado y ordenamiento)
        function aplicarFiltrosAdicionales() {
          const filtroLiga = document.getElementById("filtro-liga").value;
          const filtroEstado = document.getElementById("filtro-estado").value;
          
          partidosFiltrados = partidosOriginales.filter(partido => {
            const cumpleLiga = !filtroLiga || partido.LIGA === filtroLiga;
            const cumpleEstado = !filtroEstado || partido.estado === filtroEstado;
            return cumpleLiga && cumpleEstado;
          });
          
          ordenarPartidos();
          actualizarContadorPartidos();
        }

        // Ordenar partidos
        function ordenarPartidos() {
          const criterio = document.getElementById("ordenar-por").value;
          
          partidosFiltrados.sort((a, b) => {
            switch (criterio) {
              case "fecha":
                const fechaA = new Date(a.FECHA || a.fecha);
                const fechaB = new Date(b.FECHA || b.fecha);
                return fechaA - fechaB;
              
              case "liga":
                return (a.LIGA || "").localeCompare(b.LIGA || "");
              
              case "campo":
                return (a.CAMPO || "").localeCompare(b.CAMPO || "");
              
              case "equipos":
                const equipoA = `${a.LOCAL || ""} vs ${a.VISITANTE || ""}`;
                const equipoB = `${b.LOCAL || ""} vs ${b.VISITANTE || ""}`;
                return equipoA.localeCompare(equipoB);
              
              default:
                return 0;
            }
          });
        }

        // Mostrar partidos en la interfaz
        function mostrarPartidos() {
          const container = document.getElementById("partidos-lista");
          const sinResultados = document.getElementById("sin-resultados");
          
          if (partidosFiltrados.length === 0) {
            container.innerHTML = "";
            sinResultados.classList.remove("hidden");
            return;
          }
          
          sinResultados.classList.add("hidden");
          
          container.innerHTML = partidosFiltrados.map(partido => {
            // Función para extraer fecha de cualquier formato de objeto Firestore
            function extraerFechaDeObjeto(fechaObj) {
              if (!fechaObj) return new Date();
              
              // Si ya es un objeto Date nativo
              if (fechaObj instanceof Date) {
                return fechaObj;
              }
              
              // Si es un timestamp de Firestore (tiene propiedad seconds)
              if (fechaObj.seconds) {
                return new Date(fechaObj.seconds * 1000);
              }
              
              // Si tiene propiedades _seconds (formato interno de Firestore)
              if (fechaObj._seconds) {
                return new Date(fechaObj._seconds * 1000);
              }
              
              // Si tiene método toDate (objeto Timestamp de Firestore)
              if (fechaObj.toDate && typeof fechaObj.toDate === 'function') {
                return fechaObj.toDate();
              }
              
              // Si es string, intentar parsear
              if (typeof fechaObj === 'string') {
                const fecha = new Date(fechaObj);
                if (!isNaN(fecha.getTime())) {
                  return fecha;
                }
              }
              
              // Fallback
              return new Date();
            }
            
            const fecha = extraerFechaDeObjeto(partido.FECHA || partido.fecha);
            const fechaFormateada = fecha.toLocaleDateString("es-ES", {
              weekday: "long",
              year: "numeric",
              month: "long",
              day: "numeric"
            });
            const horaFormateada = fecha.toLocaleTimeString("es-ES", {
              hour: "2-digit",
              minute: "2-digit"
            });
            
            const estado = partido.estado || "programado";
            const estadoColor = {
              programado: "bg-blue-100 text-blue-800",
              finalizado: "bg-green-100 text-green-800",
              suspendido: "bg-red-100 text-red-800"
            }[estado] || "bg-gray-100 text-gray-800";
            
            const estadoIcon = {
              programado: "fas fa-clock",
              finalizado: "fas fa-check-circle",
              suspendido: "fas fa-times-circle"
            }[estado] || "fas fa-question-circle";

            return `
              <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 hover:shadow-xl transition">
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                  <!-- Información principal -->
                  <div class="flex-1">
                    <div class="flex items-center gap-3 mb-3">
                      <div class="w-12 h-12 bg-primary/10 text-primary rounded-xl flex items-center justify-center">
                        <i class="fas fa-futbol text-xl"></i>
                      </div>
                      <div>
                        <h3 class="text-xl font-bold text-gray-800">${partido.LOCAL || "TBD"} vs ${partido.VISITANTE || "TBD"}</h3>
                        <p class="text-gray-600">${partido.LIGA || "Liga no especificada"}</p>
                      </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                      <div class="flex items-center gap-2">
                        <i class="fas fa-calendar text-gray-500"></i>
                        <span class="text-gray-700">${fechaFormateada}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <i class="fas fa-clock text-gray-500"></i>
                        <span class="text-gray-700">${horaFormateada}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <i class="fas fa-map-marker-alt text-gray-500"></i>
                        <span class="text-gray-700">${partido.CAMPO || "Campo por definir"}</span>
                      </div>
                    </div>
                    
                    <!-- Información del árbitro -->
                    <div class="mt-3 flex items-center gap-2 bg-gray-50 px-3 py-2 rounded-lg">
                      <i class="fas fa-whistle text-gray-500"></i>
                      <span class="text-gray-700 text-sm">
                        <strong>Árbitro:</strong> 
                        ${partido.ARBITRO === currentUser.id ? 
                          `<span class="text-green-600 font-semibold">Tú (${currentUser.nombre || 'Usuario'})</span>` : 
                          `<span class="text-gray-600">${partido.ARBITRO || 'No asignado'}</span>`
                        }
                      </span>
                    </div>
                    
                    ${partido.JORNADA ? `
                      <div class="mt-2 flex items-center gap-2">
                        <i class="fas fa-list-ol text-gray-500"></i>
                        <span class="text-gray-700 text-sm">Jornada ${partido.JORNADA}</span>
                      </div>
                    ` : ""}
                  </div>
                  
                  <!-- Estado y acciones -->
                  <div class="flex flex-col items-end gap-3">
                    <div class="flex items-center gap-2 px-3 py-1 rounded-full ${estadoColor}">
                      <i class="${estadoIcon}"></i>
                      <span class="font-semibold capitalize">${estado}</span>
                    </div>
                    
                    ${estado === "programado" ? `
                      <button onclick="abrirActa('${partido.id}')" class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-orange-600 transition text-sm font-semibold">
                        <i class="fas fa-pen-nib mr-2"></i>Acta
                      </button>
                    ` : estado === "finalizado" ? `
                      <div class="text-center">
                        <div class="text-2xl font-bold text-gray-800">${partido.GOLESLOCAL || 0} - ${partido.GOLESVISITANTE || 0}</div>
                        <div class="text-xs text-gray-500">Resultado final</div>
                      </div>
                    ` : ""}
                  </div>
                </div>
              </div>
            `;
          }).join("");
        }

        // Event listeners
        document.getElementById("buscar").addEventListener("click", buscarPartidos);
        
        document.getElementById("filtro-liga").addEventListener("change", () => {
          if (partidosOriginales.length > 0) {
            aplicarFiltrosAdicionales();
            mostrarPartidos();
          }
        });
        
        document.getElementById("filtro-estado").addEventListener("change", () => {
          if (partidosOriginales.length > 0) {
            aplicarFiltrosAdicionales();
            mostrarPartidos();
          }
        });
        
        document.getElementById("ordenar-por").addEventListener("change", () => {
          if (partidosOriginales.length > 0) {
            aplicarFiltrosAdicionales();
            mostrarPartidos();
          }
        });
        
        document.getElementById("limpiar-filtros").addEventListener("click", () => {
          document.getElementById("filtro-liga").value = "";
          document.getElementById("filtro-estado").value = "";
          document.getElementById("ordenar-por").value = "fecha";
          
          // Recargar partidos originales sin filtros
          if (partidosOriginales.length > 0) {
            partidosFiltrados = [...partidosOriginales];
            actualizarContadorPartidos();
            mostrarPartidos();
          }
        });
        
        document.getElementById("reintentar").addEventListener("click", cargarPartidos);

        // Función global para abrir acta
        window.abrirActa = function(partidoId) {
          window.location.href = `actas.html?partido=${partidoId}`;
        };

        // Inicialización
        setTimeout(() => {
          if (typeof window.getCurrentUser === "function") {
            if (checkArbitroAccess()) {
              cargarPartidos();
            }
          } else {
            show404Page();
          }
        }, 100);
      });
    </script>
  </body>
</html>
