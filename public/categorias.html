<!-- Force cache refresh v3 -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Portal Deportivo - Asociación de la Paz</title>
  <link rel="icon" href="images/De_la_Paz.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563EB', // Azul principal
            secondary: '#F97316', // Naranja acento
            neutralbg: '#F3F4F6'  // Gris claro para fondos
          }
        }
      }
    }
  </script>
  
</head>
<body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">

<div id="nav-container"></div>

<div id="main-content" class="flex-1">
  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-3xl font-bold text-primary">Listado de Categorías</h2>
      <div class="flex gap-3">
        <button onclick="window.history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-6 rounded-lg transition font-semibold shadow-md flex items-center gap-2">
          <i class="fas fa-arrow-left"></i>Volver
        </button>
        <a href="creaCategoria.html" class="bg-secondary text-white py-2 px-6 rounded-lg hover:bg-orange-600 transition font-semibold shadow-md">
          <i class="fas fa-plus-circle mr-2"></i>Añadir Categoría
        </a>
      </div>
    </div>

    <div id="loading-state" class="text-center py-10">
        <p class="text-lg text-gray-600">Cargando categorías...</p>
    </div>

    <div id="error-state" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative my-4">
        <strong class="font-bold">Error:</strong>
        <span class="block sm:inline" id="error-message">No se pudieron cargar las categorías.</span>
    </div>

    <div id="table-container" class="hidden bg-white p-8 rounded-2xl shadow-lg border-2 border-primary overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Edades</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Años Nacimiento</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Denominación</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody id="category-list" class="bg-white divide-y divide-gray-200">
          <!-- Las filas de las categorías se insertarán aquí dinámicamente -->
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="footer-container"></div>

<!-- Modal de Edición -->
<div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
  <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-1/2 lg:w-1/3 shadow-lg rounded-md bg-white">
    <div class="mt-3">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-900">Editar Categoría</h3>
        <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      
      <form id="editForm" class="space-y-4">
        <div>
          <label for="editNombre" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-tag text-primary mr-1"></i>Nombre *
          </label>
          <input type="text" id="editNombre" name="NOMBRE" required 
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="editEdadMin" class="block text-sm font-medium text-gray-700 mb-1">
              <i class="fas fa-calendar-minus text-primary mr-1"></i>Edad Mínima
            </label>
            <input type="number" id="editEdadMin" name="EdadMin" min="0" max="100"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="editEdadMax" class="block text-sm font-medium text-gray-700 mb-1">
              <i class="fas fa-calendar-plus text-primary mr-1"></i>Edad Máxima
            </label>
            <input type="number" id="editEdadMax" name="EdadMax" min="0" max="100"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="editAno1" class="block text-sm font-medium text-gray-700 mb-1">
              <i class="fas fa-calendar text-primary mr-1"></i>Año Inicio
            </label>
            <input type="number" id="editAno1" name="ano1" min="1900" max="2100"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="editAno2" class="block text-sm font-medium text-gray-700 mb-1">
              <i class="fas fa-calendar text-primary mr-1"></i>Año Fin
            </label>
            <input type="number" id="editAno2" name="ano2" min="1900" max="2100"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
        </div>
        
        <div>
          <label for="editTipo" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-venus-mars text-primary mr-1"></i>Tipo
          </label>
          <select id="editTipo" name="TIPO" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            <option value="">Seleccionar tipo</option>
            <option value="MASCULINO">Masculino</option>
            <option value="FEMENINO">Femenino</option>
            <option value="MIXTO">Mixto</option>
          </select>
        </div>
        
        <div>
          <label for="editDenominacion" class="block text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-certificate text-primary mr-1"></i>Denominación Internacional
          </label>
          <input type="text" id="editDenominacion" name="DenominacionINT"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        
        <div id="editFeedback" class="hidden p-3 rounded-md"></div>
        
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="cerrarModal()" 
                  class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors duration-200">
            <i class="fas fa-times mr-1"></i>Cancelar
          </button>
          <button type="submit" id="saveBtn"
                  class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition-colors duration-200 flex items-center">
            <span id="saveSpinner" class="hidden mr-2">
              <i class="fas fa-spinner fa-spin"></i>
            </span>
            <span id="saveText">
              <i class="fas fa-save mr-1"></i>Guardar Cambios
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal de Confirmación de Eliminación -->
<div id="deleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
  <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-1/3 shadow-lg rounded-md bg-white">
    <div class="mt-3 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
        <i class="fas fa-exclamation-triangle text-red-600 text-xl"></i>
      </div>
      <h3 class="text-lg font-medium text-gray-900 mb-2">Confirmar Eliminación</h3>
      <p class="text-sm text-gray-500 mb-4">
        ¿Estás seguro de que deseas eliminar la categoría <strong id="deleteCategoriaNombre"></strong>?
      </p>
      <p class="text-xs text-red-600 mb-6">
        <i class="fas fa-warning mr-1"></i>Esta acción no se puede deshacer.
      </p>
      
      <div id="deleteFeedback" class="hidden p-3 rounded-md mb-4"></div>
      
      <div class="flex justify-center space-x-3">
        <button type="button" onclick="cerrarModalEliminar()" 
                class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition-colors duration-200">
          <i class="fas fa-times mr-1"></i>Cancelar
        </button>
        <button type="button" onclick="confirmarEliminacion()" id="deleteBtn"
                class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors duration-200 flex items-center">
          <span id="deleteSpinner" class="hidden mr-2">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
          <span id="deleteText">
            <i class="fas fa-trash mr-1"></i>Eliminar
          </span>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="plantilla.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  // Verificar acceso de administrador PRIMERO
  const user = getCurrentUser();

  if (!user) {
    alert('Debes iniciar sesión para acceder a esta página');
    window.location.href = 'index.html';
    return;
  }

  if (!window.hasRole(user, 'admin')) {
    alert('No tienes permisos para acceder a esta página. Solo los administradores pueden ver esta sección.');
    window.location.href = 'index.html';
    return;
  }

  // Si llegamos aquí, el usuario es administrador - continuar cargando
  const categoryList = document.getElementById('category-list');
  const loadingState = document.getElementById('loading-state');
  const errorState = document.getElementById('error-state');
  const errorMessage = document.getElementById('error-message');
  const tableContainer = document.getElementById('table-container');

  try {
    const response = await fetch('/api/categorias');
    if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.message || 'Error al conectar con el servidor');
    }
    const categorias = await response.json();

    loadingState.classList.add('hidden');

    if (categorias.length === 0) {
        errorState.classList.remove('hidden');
        errorMessage.textContent = "No hay categorías para mostrar. ¡Añade una!";
        return;
    }

    tableContainer.classList.remove('hidden');
    categoryList.innerHTML = '';

    categorias.forEach(categoria => {
      const row = document.createElement('tr');
      
      // Solo mostrar botones de acción si el usuario es administrador
      const isAdmin = window.hasRole(getCurrentUser(), 'admin');
      const accionesHtml = isAdmin ? `
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
          <div class="flex space-x-2">
            <button onclick="editarCategoria('${categoria.id}')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-xs transition-colors duration-200 flex items-center gap-1">
              <i class="fas fa-edit"></i> Editar
            </button>
            <button onclick="eliminarCategoria('${categoria.id}', '${categoria.NOMBRE}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition-colors duration-200 flex items-center gap-1">
              <i class="fas fa-trash"></i> Eliminar
            </button>
          </div>
        </td>
      ` : `
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-400">
          <i class="fas fa-lock mr-1"></i>Solo administradores
        </td>
      `;
      
      row.innerHTML = `
        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${categoria.NOMBRE}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${categoria.EdadMin} - ${categoria.EdadMax} años</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${categoria.ano2} - ${categoria.ano1}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${categoria.TIPO}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${categoria.DenominacionINT}</td>
        ${accionesHtml}
      `;
      categoryList.appendChild(row);
    });

  } catch (error) {
    console.error("Error al cargar las categorías:", error);
    loadingState.classList.add('hidden');
    errorState.classList.remove('hidden');
    errorMessage.textContent = 'No se pudieron cargar las categorías: ' + error.message;
  }
});

// Variables globales
let categoriaActual = null;
let categoriaAEliminar = null;

// Función para editar categoría
async function editarCategoria(id) {
  console.log('🔧 Intentando editar categoría:', id);
  
  // Verificar permisos (doble verificación por seguridad)
  if (!window.hasRole(getCurrentUser(), 'admin')) {
    alert('No tienes permisos para editar categorías. Solo los administradores pueden realizar esta acción.');
    return;
  }
  
  console.log('✅ Permisos verificados, continuando...');
  
  try {
    console.log('📡 Obteniendo datos de la categoría...');
    
    const token = localStorage.getItem('token');
    if (!token) {
      alert('No hay sesión activa. Inicia sesión de nuevo.');
      window.location.href = 'index.html';
      return;
    }
    
    // Obtener datos de la categoría
    const response = await fetch(`/api/categorias/${id}`, {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    console.log('📡 Respuesta del servidor:', response.status, response.statusText);
    
    if (!response.ok) {
      const errorText = await response.text();
      console.error('❌ Error del servidor:', errorText);
      throw new Error('Error al obtener los datos de la categoría: ' + response.status);
    }
    
    const categoria = await response.json();
    categoriaActual = categoria;
    
    // Llenar el formulario con los datos actuales
    document.getElementById('editNombre').value = categoria.NOMBRE || '';
    document.getElementById('editEdadMin').value = categoria.EdadMin || '';
    document.getElementById('editEdadMax').value = categoria.EdadMax || '';
    document.getElementById('editAno1').value = categoria.ano1 || '';
    document.getElementById('editAno2').value = categoria.ano2 || '';
    document.getElementById('editTipo').value = categoria.TIPO || '';
    document.getElementById('editDenominacion').value = categoria.DenominacionINT || '';
    
    // Mostrar el modal
    document.getElementById('editModal').classList.remove('hidden');
    
    // Limpiar feedback anterior
    const feedback = document.getElementById('editFeedback');
    feedback.classList.add('hidden');
    
  } catch (error) {
    console.error('Error al cargar categoría:', error);
    alert('Error al cargar los datos de la categoría: ' + error.message);
  }
}

// Función para cerrar modal de edición
function cerrarModal() {
  document.getElementById('editModal').classList.add('hidden');
  categoriaActual = null;
}

// Función para eliminar categoría
function eliminarCategoria(id, nombre) {
  // Verificar permisos (doble verificación por seguridad)
  if (!window.hasRole(getCurrentUser(), 'admin')) {
    alert('No tienes permisos para eliminar categorías. Solo los administradores pueden realizar esta acción.');
    return;
  }
  
  categoriaAEliminar = { id, nombre };
  document.getElementById('deleteCategoriaNombre').textContent = nombre;
  document.getElementById('deleteModal').classList.remove('hidden');
  
  // Limpiar feedback anterior
  const feedback = document.getElementById('deleteFeedback');
  feedback.classList.add('hidden');
}

// Función para cerrar modal de eliminación
function cerrarModalEliminar() {
  document.getElementById('deleteModal').classList.add('hidden');
  categoriaAEliminar = null;
}

// Función para confirmar eliminación
async function confirmarEliminacion() {
  if (!categoriaAEliminar) return;
  
  const deleteBtn = document.getElementById('deleteBtn');
  const deleteSpinner = document.getElementById('deleteSpinner');
  const deleteText = document.getElementById('deleteText');
  const feedback = document.getElementById('deleteFeedback');
  
  try {
    // Mostrar loading
    deleteBtn.disabled = true;
    deleteSpinner.classList.remove('hidden');
    deleteText.classList.add('opacity-60');
    feedback.classList.add('hidden');
    
    const token = localStorage.getItem('token');
    if (!token) {
      alert('No hay sesión activa. Inicia sesión de nuevo.');
      window.location.href = 'index.html';
      return;
    }
    
    const response = await fetch(`/api/categorias/${categoriaAEliminar.id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });
    
    const result = await response.json();
    
    if (response.ok) {
      // Éxito
      feedback.textContent = '¡Categoría eliminada con éxito!';
      feedback.className = 'p-3 rounded-md bg-green-100 text-green-700';
      feedback.classList.remove('hidden');
      
      // Cerrar modal después de un momento y recargar
      setTimeout(() => {
        cerrarModalEliminar();
        location.reload();
      }, 1500);
      
    } else {
      // Error del servidor
      throw new Error(result.error || 'Error al eliminar la categoría');
    }
    
  } catch (error) {
    console.error('Error al eliminar categoría:', error);
    feedback.textContent = 'Error: ' + error.message;
    feedback.className = 'p-3 rounded-md bg-red-100 text-red-700';
    feedback.classList.remove('hidden');
  } finally {
    // Restaurar botón
    deleteBtn.disabled = false;
    deleteSpinner.classList.add('hidden');
    deleteText.classList.remove('opacity-60');
  }
}

// Manejar envío del formulario de edición
document.getElementById('editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  if (!categoriaActual) return;
  
  const saveBtn = document.getElementById('saveBtn');
  const saveSpinner = document.getElementById('saveSpinner');
  const saveText = document.getElementById('saveText');
  const feedback = document.getElementById('editFeedback');
  
  try {
    // Mostrar loading
    saveBtn.disabled = true;
    saveSpinner.classList.remove('hidden');
    saveText.classList.add('opacity-60');
    feedback.classList.add('hidden');
    
    // Recopilar datos del formulario
    const formData = new FormData(e.target);
    const updateData = {};
    
    // Solo incluir campos que tienen valor
    for (let [key, value] of formData.entries()) {
      if (value.trim() !== '') {
        // Convertir números
        if (['EdadMin', 'EdadMax', 'ano1', 'ano2'].includes(key)) {
          updateData[key] = parseInt(value);
        } else {
          updateData[key] = value.trim();
        }
      }
    }
    
    // Validación básica
    if (!updateData.NOMBRE) {
      throw new Error('El nombre es obligatorio');
    }
    
    const token = localStorage.getItem('token');
    if (!token) {
      alert('No hay sesión activa. Inicia sesión de nuevo.');
      window.location.href = 'index.html';
      return;
    }
    
    console.log('📡 Enviando actualización con token');
    console.log('📦 Datos a enviar:', updateData);
    
    const response = await fetch(`/api/categorias/${categoriaActual.id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify(updateData)
    });
    
    console.log('📡 Respuesta de actualización:', response.status, response.statusText);
    
    const result = await response.json();
    console.log('📦 Resultado del servidor:', result);
    
    if (response.ok) {
      // Éxito
      feedback.textContent = '¡Categoría actualizada con éxito!';
      feedback.className = 'p-3 rounded-md bg-green-100 text-green-700';
      feedback.classList.remove('hidden');
      
      // Cerrar modal después de un momento y recargar
      setTimeout(() => {
        cerrarModal();
        location.reload();
      }, 1500);
      
    } else {
      // Error del servidor
      throw new Error(result.error || 'Error al actualizar la categoría');
    }
    
  } catch (error) {
    console.error('Error al actualizar categoría:', error);
    feedback.textContent = 'Error: ' + error.message;
    feedback.className = 'p-3 rounded-md bg-red-100 text-red-700';
    feedback.classList.remove('hidden');
  } finally {
    // Restaurar botón
    saveBtn.disabled = false;
    saveSpinner.classList.add('hidden');
    saveText.classList.remove('opacity-60');
  }
});

// Cerrar modales al hacer clic fuera
document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target.id === 'editModal') {
    cerrarModal();
  }
});

document.getElementById('deleteModal').addEventListener('click', (e) => {
  if (e.target.id === 'deleteModal') {
    cerrarModalEliminar();
  }
});
</script>

</body>
</html>
