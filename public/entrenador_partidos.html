<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Partidos - Panel de Entrenador</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="images/De_la_Paz.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              secondary: "#F97316",
              neutralbg: "#F3F4F6",
            },
          },
        },
      };
    </script>
  </head>

  <body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">
    <div id="nav-container"></div>

    <div id="main-content" class="flex-1">
      <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- Header -->
        <div
          class="mb-8 flex flex-col md:flex-row justify-between items-center"
        >
          <div>
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">
              Mis Partidos
            </h1>
            <p class="text-lg text-gray-600">
              Calendario y resultados de
              <span id="team-name" class="font-bold text-primary"
                >tu equipo</span
              >
            </p>
          </div>
          <a
            href="entrenador_panel.html"
            class="mt-4 md:mt-0 bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition"
          >
            <i class="fas fa-arrow-left mr-2"></i>Volver al Panel
          </a>
        </div>

        <!-- Estadísticas Rápidas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
          <div
            class="bg-white p-6 rounded-xl shadow-lg text-center border-l-4 border-blue-500"
          >
            <div class="text-2xl font-bold text-blue-600" id="partidos-jugados">
              0
            </div>
            <div class="text-gray-600">Jugados</div>
          </div>
          <div
            class="bg-white p-6 rounded-xl shadow-lg text-center border-l-4 border-green-500"
          >
            <div
              class="text-2xl font-bold text-green-600"
              id="partidos-ganados"
            >
              0
            </div>
            <div class="text-gray-600">Ganados</div>
          </div>
          <div
            class="bg-white p-6 rounded-xl shadow-lg text-center border-l-4 border-yellow-500"
          >
            <div
              class="text-2xl font-bold text-yellow-600"
              id="partidos-empatados"
            >
              0
            </div>
            <div class="text-gray-600">Empatados</div>
          </div>
          <div
            class="bg-white p-6 rounded-xl shadow-lg text-center border-l-4 border-red-500"
          >
            <div class="text-2xl font-bold text-red-600" id="partidos-perdidos">
              0
            </div>
            <div class="text-gray-600">Perdidos</div>
          </div>
        </div>

        <!-- Filtros -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
          <div class="flex flex-wrap gap-4 items-center">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Filtrar por:</label
              >
              <select
                id="filtro-estado"
                class="border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary focus:border-transparent"
              >
                <option value="todos">Todos los partidos</option>
                <option value="proximos">Próximos partidos</option>
                <option value="jugados">Partidos jugados</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Lista de Partidos -->
        <div class="space-y-6" id="partidos-container">
          <!-- Los partidos se cargarán aquí -->
        </div>

        <!-- Estado de carga -->
        <div id="loading-state" class="text-center py-12">
          <div
            class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto mb-4"
          ></div>
          <p class="text-gray-600">Cargando partidos...</p>
        </div>

        <!-- Estado sin partidos -->
        <div id="no-partidos-state" class="hidden text-center py-12">
          <div class="text-gray-400 mb-4">
            <i class="fas fa-calendar-times text-6xl"></i>
          </div>
          <h3 class="text-xl font-medium text-gray-600 mb-2">
            No hay partidos programados
          </h3>
          <p class="text-gray-500">
            Tu equipo aún no tiene partidos asignados.
          </p>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <script src="plantilla.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        // Verificar acceso de entrenador
        const user = getCurrentUser();

        if (!user) {
          alert("Debes iniciar sesión para acceder a esta página");
          window.location.href = "index.html";
          return;
        }

        if (!user || !window.hasRole(user, "entrenador")) {
          alert("No tienes permisos para acceder a esta página");
          window.location.href = "index.html";
          return;
        }

        // Obtener nombre del equipo
        const roles = user.roles || {};
        const miEquipo = roles.entrenador?.equipoNombre;

        if (!miEquipo) {
          mostrarMensaje("Este usuario no tiene equipo asignado", "error");
          return;
        }

        // Mostrar nombre del equipo
        document.getElementById("team-name").textContent = miEquipo;

        try {
          // 1. Buscar en qué liga está inscrito el equipo
          const ligasResponse = await fetch("/api/ligas");
          if (!ligasResponse.ok) throw new Error("Error al cargar ligas");

          const ligas = await ligasResponse.json();
          console.log("Ligas cargadas:", ligas);

          // Buscar liga que contenga mi equipo
          const miLiga = ligas.find(
            (liga) => liga.EQUIPOS && liga.EQUIPOS.includes(miEquipo)
          );

          if (!miLiga) {
            mostrarMensaje(
              "Este equipo no está inscrito en ninguna liga",
              "warning"
            );
            return;
          }

          console.log("Liga encontrada:", miLiga);

          // 2. Obtener partidos de la liga
          const partidosResponse = await fetch(
            `/api/partidos/liga/${miLiga.id}`
          );
          if (!partidosResponse.ok) throw new Error("Error al cargar partidos");

          const todosLosPartidos = await partidosResponse.json();
          console.log("Todos los partidos de la liga:", todosLosPartidos);

          // 3. Filtrar partidos donde aparezca mi equipo (LOCAL o VISITANTE)
          const misPartidos = todosLosPartidos.filter(
            (partido) =>
              partido.local === miEquipo || partido.visitante === miEquipo
          );

          console.log("Mis partidos:", misPartidos);

          if (misPartidos.length === 0) {
            mostrarMensaje(
              "No hay partidos programados para tu equipo",
              "info"
            );
            return;
          }

          // 4. Procesar y mostrar partidos
          const partidosProcesados = procesarPartidos(misPartidos, miEquipo);
          mostrarPartidos(partidosProcesados);
          actualizarEstadisticas(partidosProcesados);

          // 5. Configurar filtros
          setupFiltros(partidosProcesados);
        } catch (error) {
          console.error("Error cargando datos:", error);
          mostrarMensaje(
            "Error al cargar los datos: " + error.message,
            "error"
          );
        }
      });

      function procesarPartidos(partidos, miEquipo) {
        return partidos.map((partido) => {
          const soyLocal = partido.local === miEquipo;
          const rival = soyLocal ? partido.visitante : partido.local;

          // Formatear fecha
          let fechaFormateada = "Fecha no disponible";
          if (partido.FECHA) {
            const fecha = parsearFechaEspanol(partido.FECHA);
            fechaFormateada = fecha.toLocaleDateString("es-ES", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
            });
          }

          // Determinar estado y resultado
          let estado = "proximo";
          let resultado = null;

          if (
            partido.GOLESLOCAL !== undefined &&
            partido.GOLESVISITANTE !== undefined
          ) {
            estado = "jugado";
            const misGoles = soyLocal
              ? partido.GOLESLOCAL
              : partido.GOLESVISITANTE;
            const golesRival = soyLocal
              ? partido.GOLESVISITANTE
              : partido.GOLESLOCAL;
            resultado = { mis: misGoles, rival: golesRival };
          }

          return {
            id: partido.id,
            fecha: fechaFormateada,
            fechaOriginal: partido.FECHA,
            rival: rival,
            soyLocal: soyLocal,
            estado: estado,
            resultado: resultado,
            jornada: partido.jornada || "N/A",
            liga: partido.ligaId,
            campo: partido.CAMPO || "Campo por definir",
            arbitro: partido.ARBITRO || "Sin asignar",
          };
        });
      }

      // Función para parsear fechas en formato español
      function parsearFechaEspanol(fechaString) {
        console.log('🔍 Parseando fecha:', fechaString, 'Tipo:', typeof fechaString);
        
        if (!fechaString) {
          console.warn('⚠️ Fecha vacía, usando fecha actual');
          return new Date();
        }
        
        try {
          // Si es un objeto Firestore timestamp
          if (fechaString.seconds) {
            const fecha = new Date(fechaString.seconds * 1000);
            console.log('📅 Fecha desde timestamp:', fecha);
            return fecha;
          }
          if (fechaString.toDate && typeof fechaString.toDate === 'function') {
            const fecha = fechaString.toDate();
            console.log('📅 Fecha desde toDate():', fecha);
            return fecha;
          }
          
          // Si es string, procesarlo
          if (typeof fechaString === 'string') {
            console.log('📅 Procesando string de fecha:', fechaString);
            
            // Ejemplo: "sábado, 11 de enero de 2025 a las 10:00 AM UTC+1"
            // o "11 de enero de 2025 a las 10:00 AM UTC+1"
            
            // Mapeo de meses en español
            const mesesES = {
              'enero': '01', 'febrero': '02', 'marzo': '03', 'abril': '04',
              'mayo': '05', 'junio': '06', 'julio': '07', 'agosto': '08',
              'septiembre': '09', 'octubre': '10', 'noviembre': '11', 'diciembre': '12'
            };
            
            // Regex más flexible para capturar diferentes formatos
            const regex = /(\d{1,2})\s+de\s+(\w+)\s+de\s+(\d{4})\s+a\s+las\s+(\d{1,2}):(\d{2})\s*(AM|PM|a\.m\.|p\.m\.)?/i;
            const match = fechaString.match(regex);
            
            console.log('🔍 Regex match:', match);
            
            if (match) {
              const [, dia, mes, año, hora, minuto, ampm] = match;
              const mesNumero = mesesES[mes.toLowerCase()];
              
              console.log('📅 Componentes extraídos:', {
                dia, mes, año, hora, minuto, ampm, mesNumero
              });
              
              if (mesNumero) {
                let hora24 = parseInt(hora);
                
                // Convertir a formato 24h si es necesario
                if (ampm) {
                  const ampmLower = ampm.toLowerCase();
                  if ((ampmLower.includes('pm') || ampmLower.includes('p.m')) && hora24 !== 12) {
                    hora24 += 12;
                  } else if ((ampmLower.includes('am') || ampmLower.includes('a.m')) && hora24 === 12) {
                    hora24 = 0;
                  }
                }
                
                // Crear fecha en formato ISO
                const fechaISO = `${año}-${mesNumero}-${dia.padStart(2, '0')}T${hora24.toString().padStart(2, '0')}:${minuto}:00`;
                console.log('📅 Fecha ISO creada:', fechaISO);
                
                const fechaFinal = new Date(fechaISO);
                console.log('📅 Fecha final parseada:', fechaFinal);
                console.log('📅 Año de la fecha final:', fechaFinal.getFullYear());
                
                if (!isNaN(fechaFinal.getTime())) {
                  return fechaFinal;
                }
              }
            }
            
            // Fallback: intentar parseo directo
            console.log('🔄 Intentando parseo directo...');
            const fechaDirecta = new Date(fechaString);
            if (!isNaN(fechaDirecta.getTime())) {
              console.log('✅ Parseo directo exitoso:', fechaDirecta);
              return fechaDirecta;
            }
          }
          
          // Si todo falla, usar fecha actual
          console.warn('⚠️ No se pudo parsear la fecha:', fechaString, 'usando fecha actual');
          return new Date();
          
        } catch (error) {
          console.error('❌ Error parseando fecha:', error, fechaString);
          return new Date();
        }
      }

      function mostrarMensaje(mensaje, tipo) {
        const loadingState = document.getElementById("loading-state");
        const noPartidosState = document.getElementById("no-partidos-state");
        const partidosContainer = document.getElementById("partidos-container");

        loadingState.classList.add("hidden");
        partidosContainer.innerHTML = "";

        // Actualizar el mensaje
        const iconos = {
          error: "fas fa-exclamation-triangle text-red-500",
          warning: "fas fa-exclamation-circle text-yellow-500",
          info: "fas fa-info-circle text-blue-500",
        };

        const colores = {
          error: "text-red-600",
          warning: "text-yellow-600",
          info: "text-blue-600",
        };

        noPartidosState.innerHTML = `
                <div class="text-gray-400 mb-4">
                    <i class="${
                      iconos[tipo] || "fas fa-calendar-times"
                    } text-6xl"></i>
                </div>
                <h3 class="text-xl font-medium ${
                  colores[tipo] || "text-gray-600"
                } mb-2">${mensaje}</h3>
            `;
        noPartidosState.classList.remove("hidden");
      }

      function setupFiltros(partidos) {
        document
          .getElementById("filtro-estado")
          .addEventListener("change", (e) => {
            const filtro = e.target.value;
            let partidosFiltrados = partidos;

            if (filtro === "proximos") {
              partidosFiltrados = partidos.filter(
                (p) => p.estado === "proximo"
              );
            } else if (filtro === "jugados") {
              partidosFiltrados = partidos.filter((p) => p.estado === "jugado");
            }

            mostrarPartidos(partidosFiltrados);
          });
      }

      function mostrarPartidos(partidos) {
        const container = document.getElementById("partidos-container");
        const loadingState = document.getElementById("loading-state");
        const noPartidosState = document.getElementById("no-partidos-state");

        loadingState.classList.add("hidden");

        if (partidos.length === 0) {
          container.innerHTML = "";
          noPartidosState.classList.remove("hidden");
          return;
        }

        noPartidosState.classList.add("hidden");
        container.innerHTML = "";

        partidos.forEach((partido) => {
          const partidoElement = crearElementoPartido(partido);
          container.appendChild(partidoElement);
        });
      }

      function crearElementoPartido(partido) {
        const div = document.createElement("div");
        div.className =
          "bg-white rounded-xl shadow-lg p-6 hover:shadow-xl transition-shadow";

        let contenidoResultado = "";
        let estadoClass = "";

        if (partido.estado === "proximo") {
          contenidoResultado = `
                    <div class="text-center">
                        <div class="text-2xl font-bold text-gray-400">VS</div>
                        <div class="text-sm text-gray-500 mt-1">Jornada ${partido.jornada}</div>
                    </div>
                `;
          estadoClass = "border-l-4 border-blue-500";
        } else {
          const misGoles = partido.resultado.mis;
          const rivalGoles = partido.resultado.rival;

          let resultadoClass = "text-gray-600";
          if (misGoles > rivalGoles) resultadoClass = "text-green-600";
          else if (misGoles < rivalGoles) resultadoClass = "text-red-600";
          else resultadoClass = "text-yellow-600";

          contenidoResultado = `
                    <div class="text-center">
                        <div class="text-2xl font-bold ${resultadoClass}">
                            ${misGoles} - ${rivalGoles}
                        </div>
                        <div class="text-sm text-gray-500 mt-1">Final - J${partido.jornada}</div>
                    </div>
                `;

          if (misGoles > rivalGoles)
            estadoClass = "border-l-4 border-green-500";
          else if (misGoles < rivalGoles)
            estadoClass = "border-l-4 border-red-500";
          else estadoClass = "border-l-4 border-yellow-500";
        }

        div.className += ` ${estadoClass}`;

        div.innerHTML = `
                <div class="flex flex-col md:flex-row items-center justify-between">
                    <div class="flex-1 mb-4 md:mb-0">
                        <div class="text-sm text-gray-500 mb-1">${
                          partido.fecha || fechaFormateada
                        }</div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <div class="font-bold text-lg text-primary">Mi Equipo</div>
                                <div class="text-sm text-gray-600">${
                                  partido.soyLocal ? "Local" : "Visitante"
                                }</div>
                            </div>
                            ${contenidoResultado}
                            <div class="text-left">
                                <div class="font-bold text-lg text-gray-800">${
                                  partido.rival
                                }</div>
                                <div class="text-sm text-gray-600">${
                                  partido.soyLocal ? "Visitante" : "Local"
                                }</div>
                            </div>
                        </div>
                        <div class="text-center text-xs text-gray-600 mt-2 space-y-1">
                            <div><i class="fas fa-map-marker-alt mr-1"></i>${partido.campo}</div>
                            <div><i class="fas fa-user-tie mr-1"></i>Árbitro: ${partido.arbitro}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        ${
                          partido.estado === "proximo"
                            ? `<div class="mt-2">
                                <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
                                    Próximo
                                </span>
                            </div>`
                            : `<div class="mt-2">
                                <span class="bg-gray-100 text-gray-800 px-3 py-1 rounded-full text-sm font-medium">
                                    Finalizado
                                </span>
                            </div>`
                        }
                    </div>
                </div>
            `;

        return div;
      }

      function actualizarEstadisticas(partidos) {
        const partidosJugados = partidos.filter((p) => p.estado === "jugado");
        let ganados = 0,
          empatados = 0,
          perdidos = 0;

        partidosJugados.forEach((partido) => {
          const misGoles = partido.resultado.mis;
          const rivalGoles = partido.resultado.rival;

          if (misGoles > rivalGoles) ganados++;
          else if (misGoles === rivalGoles) empatados++;
          else perdidos++;
        });

        document.getElementById("partidos-jugados").textContent =
          partidosJugados.length;
        document.getElementById("partidos-ganados").textContent = ganados;
        document.getElementById("partidos-empatados").textContent = empatados;
        document.getElementById("partidos-perdidos").textContent = perdidos;
      }
    </script>
  </body>
</html>
