<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendario - Portal Deportivo</title>
    <link rel="icon" type="image/png" href="images/De_la_Paz.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",
              secondary: "#F97316",
              neutralbg: "#F3F4F6",
            },
          },
        },
      };
    </script>
    <style>
      .league-card {
        transition: all 0.3s ease;
      }

      .league-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }

      .match-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }

      /* Animation for generating calendar */
      @keyframes pulse-ring {
        0% {
          transform: scale(0.33);
        }

        80%,
        100% {
          opacity: 0;
        }
      }

      .generating-loader::before {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: var(--color-primary);
        border-radius: 50%;
        animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
    </style>
  </head>

  <body class="flex flex-col min-h-screen bg-neutralbg text-gray-900">
    <div id="nav-container"></div>

    <div id="main-content" class="flex-1">
      <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
          <div>
            <h1 class="text-4xl font-extrabold text-primary mb-2">
              <i class="fas fa-calendar-alt mr-3"></i>Calendario de Ligas
            </h1>
            <p class="text-lg text-gray-600">Selecciona una liga para generar y visualizar su calendario provisional.</p>
          </div>
          <div class="flex gap-3">
            <button onclick="window.history.back()" class="bg-gray-500 hover:bg-gray-600 text-white py-3 px-6 rounded-xl font-semibold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
              <i class="fas fa-arrow-left"></i>Volver
            </button>
          </div>
        </div>

        <!-- League Selection Grid -->
        <div
          id="league-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12"
        >
          <!-- Leagues will be injected here -->
          <div class="col-span-full text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-primary"></i>
            <p class="mt-4 text-gray-500">Cargando ligas...</p>
          </div>
        </div>

        <!-- Calendar Display Section -->
        <div id="calendar-section" class="hidden">
          <div
            class="flex flex-col sm:flex-row justify-between items-center mb-8 border-b pb-4 gap-4"
          >
            <div>
              <h2
                id="selected-league-title"
                class="text-3xl font-bold text-gray-800"
              ></h2>
              <span
                id="calendar-status-badge"
                class="hidden inline-block mt-2 px-3 py-1 rounded-full text-xs font-semibold"
              ></span>
            </div>
            <div class="flex gap-3">
              <button
                id="save-calendar-btn"
                class="hidden bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition shadow flex items-center gap-2"
              >
                <i class="fas fa-save"></i> Guardar Oficialmente
              </button>
              <button
                id="regenerate-calendar-btn"
                class="hidden bg-yellow-500 text-white px-4 py-2 rounded-lg hover:bg-yellow-600 transition shadow flex items-center gap-2"
              >
                <i class="fas fa-redo"></i> Regenerar
              </button>
              <button
                id="back-to-leagues"
                class="text-primary hover:text-blue-700 font-medium flex items-center gap-2 transition hover:-translate-x-1"
              >
                <i class="fas fa-arrow-left"></i> Volver a Ligas
              </button>
            </div>
          </div>

          <div id="generation-status" class="hidden text-center py-20">
            <div class="inline-block relative w-16 h-16 mb-4">
              <div
                class="absolute inset-0 bg-blue-400 rounded-full opacity-25 animate-ping"
              ></div>
              <div
                class="relative flex items-center justify-center w-full h-full bg-primary rounded-full text-white text-2xl"
              >
                <i class="fas fa-calendar-alt"></i>
              </div>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">
              Generando Calendario Provisional
            </h3>
            <p class="text-gray-500">
              Calculando jornadas y enfrentamientos...
            </p>
          </div>

          <div id="calendar-content" class="space-y-8 animate-fade-in-up">
            <!-- Rounds/Jornadas will be injected here -->
          </div>
        </div>
      </main>
    </div>

    <div id="footer-container"></div>

    <script src="plantilla.js"></script>
    <script src="js/api-client.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const leagueContainer = document.getElementById("league-container");
        const calendarSection = document.getElementById("calendar-section");
        const calendarContent = document.getElementById("calendar-content");
        const selectedLeagueTitle = document.getElementById(
          "selected-league-title"
        );
        const backBtn = document.getElementById("back-to-leagues");
        const generationStatus = document.getElementById("generation-status");
        const saveCalendarBtn = document.getElementById("save-calendar-btn");
        const regenerateCalendarBtn = document.getElementById(
          "regenerate-calendar-btn"
        );
        const calendarStatusBadge = document.getElementById(
          "calendar-status-badge"
        );

        let selectedLeague = null;
        let lastGeneratedRounds = null;
        let isAdmin = false;

        // BLOQUE DE PERMISOS
        // Determinar si el usuario es admin
        try {
          const userSession = localStorage.getItem("userSession");
          const user = userSession ? JSON.parse(userSession) : null;
          // Verificamos si existe el usuario y si tiene rol admin
          isAdmin = !!(user && window.hasRole && window.hasRole(user, "admin"));
        } catch (e) {
          isAdmin = false;
        }

        // Ocultar botones si no es admin
        if (!isAdmin) {
          if (saveCalendarBtn) saveCalendarBtn.classList.add("hidden");
          if (regenerateCalendarBtn)
            regenerateCalendarBtn.classList.add("hidden");
        }

        //Helper to set status badge
        function setCalendarStatus(text, type = "info") {
          if (!calendarStatusBadge) return;

          calendarStatusBadge.classList.remove(
            "hidden",
            "bg-blue-100",
            "text-blue-800",
            "bg-green-100",
            "text-green-800",
            "bg-yellow-100",
            "text-yellow-800",
            "bg-red-100",
            "text-red-800",
            "bg-primary",
            "bg-secondary",
            "text-white"
          );

          switch (type) {
            case "ok":
              // Éxito → secondary (naranja)
              calendarStatusBadge.classList.add("bg-secondary", "text-white");
              break;

            case "warn":
              // Provisional / aviso → naranja claro
              calendarStatusBadge.classList.add(
                "bg-orange-100",
                "text-secondary"
              );
              break;

            case "error":
              // Error → rojo (Tailwind estándar, no rompe paleta)
              calendarStatusBadge.classList.add("bg-red-100", "text-red-700");
              break;

            default:
              // Info → primary (azul)
              calendarStatusBadge.classList.add("bg-primary", "text-white");
          }

          calendarStatusBadge.textContent = text;
        }

        // Mock Data if API fails or for demo
        // 1. Fetch Leagues
        async function loadLeagues() {
          try {
            const response = await fetch("/api/ligas");
            if (!response.ok) throw new Error("Error al cargar ligas");
            const leagues = await response.json();

            // Mapear para asegurar formato correcto
            // La API devuelve ligas con propiedad EQUIPOS (lista de nombres strings)
            const processedLeagues = leagues.map((l) => ({
              id: l.id,
              nombre: l.NOMBRE,
              equipos: l.EQUIPOS ? l.EQUIPOS.length : 0,
              listaEquipos: l.EQUIPOS || [], // Guardamos la lista real de equipos
            }));

            renderLeagues(processedLeagues);
          } catch (error) {
            console.error("Error loading leagues:", error);
            leagueContainer.innerHTML =
              '<p class="text-center col-span-full text-red-500">Error al cargar las ligas. Por favor, intenta de nuevo más tarde.</p>';
          }
        }

        function renderLeagues(leagues) {
          leagueContainer.innerHTML = "";

          if (leagues.length === 0) {
            leagueContainer.innerHTML =
              '<p class="text-center col-span-full text-gray-500">No hay ligas disponibles.</p>';
            return;
          }

          leagues.forEach((league) => {
            const card = document.createElement("div");
            card.className =
              "league-card bg-white rounded-xl shadow-md border border-gray-100 p-6 cursor-pointer group hover:border-primary";
            const statusClass =
              league.equipos > 0
                ? "bg-orange-100 text-secondary"
                : "bg-gray-100 text-gray-600";
            const statusText = league.equipos > 0 ? "Activa" : "Pendiente";
            card.innerHTML = `
                        <div class="flex items-start justify-between mb-4">
                            <div class="p-3 bg-blue-50 rounded-lg group-hover:bg-blue-100 transition-colors">
                                <i class="fas fa-trophy text-2xl text-primary"></i>
                            </div>
                            <span class="${statusClass} text-xs font-semibold px-2.5 py-0.5 rounded-full">${statusText}</span>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2 group-hover:text-primary transition-colors">${
                          league.nombre
                        }</h3>
                        <p class="text-gray-500 text-sm mb-4">Temporada 2024/2025</p>
                        <div class="flex items-center text-sm text-gray-500">
                            <i class="fas fa-users mr-2"></i>
                            <span>${
                              league.equipos || 8
                            } Equipos (Estimado)</span>
                        </div>
                    `;

            card.addEventListener("click", () => selectLeague(league));
            leagueContainer.appendChild(card);
          });
        }

        // 2. Select League & Generate Calendar
        function selectLeague(league) {
          selectedLeague = league;
          lastGeneratedRounds = null;
          leagueContainer.classList.add("hidden");
          document.querySelector(".text-center.mb-12").classList.add("hidden"); // Hide main title
          calendarSection.classList.remove("hidden");

          selectedLeagueTitle.textContent = league.nombre;
          calendarContent.innerHTML = "";

          // Show generating animation
          generationStatus.classList.remove("hidden");

          // Simulate calculation delay
          setTimeout(() => {
            generationStatus.classList.add("hidden");
            // Pasamos la lista real de equipos si existe, sino generamos placeholders
            loadCalendarFromApiOrFallback(league);
          }, 800);
        }

        // Intentar cargar calendario desde API, si falla usar provisional
        async function loadCalendarFromApiOrFallback(league) {
          // 1- Intentar calendario guardado (API)
          try {
            if (typeof apiRequest === "function") {
              const rounds = await apiRequest(`/calendario/liga/${league.id}`);
              if (Array.isArray(rounds) && rounds.length > 0) {
                renderCalendar(
                  rounds.map((r) => ({
                    number: r.number,
                    date: r.date ? new Date(r.date) : null,
                    matches: r.matches || [],
                  }))
                );

                setCalendarStatus("Calendario oficial guardado", "ok");
                if (isAdmin && saveCalendarBtn)
                  saveCalendarBtn.classList.add("hidden"); // si ya es oficial, no hace falta guardar
                if (isAdmin && regenerateCalendarBtn)
                  regenerateCalendarBtn.classList.remove("hidden");
                lastGeneratedRounds = null;

                return;
              }
            }
          } catch (e) {
            console.warn("Calendario API falló, uso provisional:", e);
          }

          // 2- Si no hay calendario oficial, generar provisional
          lastGeneratedRounds = generateProvisionalCalendar(
            league.listaEquipos,
            league.equipos
          );

          setCalendarStatus("Calendario provisional (aún no guardado)", "warn");
          if (isAdmin && saveCalendarBtn)
            saveCalendarBtn.classList.remove("hidden");
          if (isAdmin && regenerateCalendarBtn)
            regenerateCalendarBtn.classList.remove("hidden");
        }

        // 3. Round Robin Logic with Real Dates
        function generateProvisionalCalendar(teamList, numTeams) {
          let teams = [];

          // Usar nombres reales si existen
          if (teamList && teamList.length > 0) {
            teams = [...teamList];
          } else {
            // Fallback a placeholders
            for (let i = 1; i <= numTeams; i++) {
              teams.push(`Equipo ${i}`);
            }
          }

          // If odd number of teams, add a phantom team for "Bye"
          if (teams.length % 2 !== 0) {
            teams.push("DESCANSA");
          }

          const totalTeams = teams.length;
          const matchesPerRound = totalTeams / 2;
          const numRounds = totalTeams - 1;

          const rounds = [];
          let tempTeams = [...teams];

          // Configurar fecha de inicio (ej: próximo sábado)
          let matchDate = new Date();
          matchDate.setDate(
            matchDate.getDate() + ((6 - matchDate.getDay() + 7) % 7)
          ); // Próximo sábado
          if (matchDate < new Date())
            matchDate.setDate(matchDate.getDate() + 7); // Asegurar futuro

          for (let round = 0; round < numRounds; round++) {
            const matches = [];

            for (let i = 0; i < matchesPerRound; i++) {
              const home = tempTeams[i];
              const away = tempTeams[totalTeams - 1 - i];

              if (home === "DESCANSA" || away === "DESCANSA") {
                matches.push({
                  home: home === "DESCANSA" ? away : home,
                  away: "DESCANSA",
                });
              } else {
                matches.push({ home, away });
              }
            }

            rounds.push({
              number: round + 1,
              date: new Date(matchDate), // Copiar fecha
              matches: matches,
            });

            // Rotar equipos (Round Robin standard)
            // Fijo el primero (index 0), rotan los demás
            const first = tempTeams[0];
            const remaining = tempTeams.slice(1);
            const last = remaining.pop();
            remaining.unshift(last);
            tempTeams = [first, ...remaining];

            // Incrementar fecha (1 semana)
            matchDate.setDate(matchDate.getDate() + 7);
          }

          renderCalendar(rounds);
          return rounds;
        }

        function renderCalendar(rounds) {
          if (rounds.length === 0) return;

          const grid = document.createElement("div");
          grid.className = "grid grid-cols-1 lg:grid-cols-2 gap-6";

          rounds.forEach((round) => {
            const roundEl = document.createElement("div");
            roundEl.className =
              "bg-white rounded-lg shadow border border-gray-100 overflow-hidden hover:shadow-md transition-shadow";

            const dateStr = round.date
              ? round.date.toLocaleDateString("es-ES", {
                  weekday: "long",
                  year: "numeric",
                  month: "long",
                  day: "numeric",
                })
              : "Fecha pendiente";

            const header = document.createElement("div");
            header.className =
              "bg-gray-50 px-4 py-3 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-2";
            header.innerHTML = `
                        <div class="flex items-center gap-2">
                            <h4 class="font-bold text-gray-700">Jornada ${round.number}</h4>
                            <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full capitalize">${dateStr}</span>
                        </div>
                        <span class="text-xs text-gray-400">Provisional</span>
                    `;

            const list = document.createElement("div");
            list.className = "p-4 space-y-3";

            round.matches.forEach((match) => {
              const matchRow = document.createElement("div");
              matchRow.className = "flex items-center justify-between text-sm";

              if (match.away === "DESCANSA") {
                matchRow.innerHTML = `
                                <span class="font-medium text-gray-500 italic">${match.home}</span>
                                <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded">Descansa</span>
                            `;
              } else {
                matchRow.innerHTML = `
                                <div class="flex-1 text-right font-medium text-gray-800">${match.home}</div>
                                <div class="px-4 text-gray-400 text-xs font-bold">VS</div>
                                <div class="flex-1 text-left font-medium text-gray-800">${match.away}</div>
                            `;
              }
              list.appendChild(matchRow);
            });

            roundEl.appendChild(header);
            roundEl.appendChild(list);
            grid.appendChild(roundEl);
          });

          calendarContent.appendChild(grid);
        }

        // 4. Back Button
        backBtn.addEventListener("click", () => {
          calendarSection.classList.add("hidden");
          leagueContainer.classList.remove("hidden");
          document
            .querySelector(".text-center.mb-12")
            .classList.remove("hidden");
        });

        // regenerate calendar button
        if (regenerateCalendarBtn) {
          regenerateCalendarBtn.addEventListener("click", async () => {
            if (!isAdmin || !selectedLeague) return;

            lastGeneratedRounds = generateProvisionalCalendar(
              selectedLeague.listaEquipos,
              selectedLeague.equipos
            );

            setCalendarStatus(
              "Calendario provisional regenerado (sin guardar)",
              "warn"
            );
            if (saveCalendarBtn) saveCalendarBtn.classList.remove("hidden");
          });
        }

        // save calendar button
        if (saveCalendarBtn) {
          saveCalendarBtn.addEventListener("click", async () => {
            if (!isAdmin) return;

            if (!selectedLeague || !selectedLeague.id) {
              alert("No hay liga seleccionada.");
              return;
            }

            if (!lastGeneratedRounds || lastGeneratedRounds.length === 0) {
              alert("No hay un calendario provisional generado para guardar.");
              return;
            }

            const ok = confirm(
              "Esto guardará el calendario en la base de datos y reemplazará el existente para esta liga. ¿Continuar?"
            );
            if (!ok) return;

            try {
              saveCalendarBtn.disabled = true;
              setCalendarStatus("Guardando calendario oficial...", "info");

              // 1) Borrar partidos anteriores de esa liga (para evitar duplicados)
              try {
                await Partidos.deleteByLiga(selectedLeague.id);
              } catch (e) {
                // Si falla, no paramos: puede que no hubiera partidos aún
                console.warn(
                  "No se pudieron borrar partidos previos (posible vacío):",
                  e
                );
              }

              // 2) Convertir rounds -> partidos para batch
              const partidos = [];
              lastGeneratedRounds.forEach((round) => {
                const fechaISO = round.date
                  ? new Date(round.date).toISOString()
                  : new Date().toISOString();

                (round.matches || []).forEach((m) => {
                  // No guardar descansos
                  if (!m || !m.home || !m.away) return;
                  if (m.home === "DESCANSA" || m.away === "DESCANSA") return;

                  partidos.push({
                    ligaId: selectedLeague.id,
                    jornada: round.number,
                    local: m.home,
                    visitante: m.away,
                    fecha: fechaISO,
                    temporada: "N/A",
                  });
                });
              });

              if (partidos.length === 0) {
                alert("El calendario no tiene partidos válidos para guardar.");
                return;
              }

              // 3) Guardar batch
              await Partidos.createBatch(partidos);

              setCalendarStatus(
                "Calendario oficial guardado correctamente",
                "ok"
              );
              alert("Calendario guardado correctamente ✅");

              // 4) Recargar desde API para verlo ya como oficial
              await loadCalendarFromApiOrFallback(selectedLeague);
            } catch (error) {
              console.error("Error guardando calendario:", error);
              setCalendarStatus("Error al guardar el calendario", "error");
              alert("Error al guardar el calendario: " + error.message);
            } finally {
              saveCalendarBtn.disabled = false;
            }
          });
        }

        // Init
        loadLeagues();
      });
    </script>
  </body>
</html>
